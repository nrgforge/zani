[package]
name = "zani"
version = "0.2.0"
edition = "2024"
description = "A terminal writing app"
repository = "https://github.com/nrgforge/zani"
homepage = "https://github.com/nrgforge/zani"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
ropey = "1.6"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
